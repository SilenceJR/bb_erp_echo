  customer.CustomerResponse:
    properties:
      address:
        description: Address 是客户地址。
        example: 深圳市宝安区
        type: string
      code:
        description: Code 是客户编码。
        example: CUST-001
        type: string
      contacts:
        description: Contacts 是客户联系人列表。
        items:
