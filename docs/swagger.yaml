      created_at:
        description: CreatedAt 是创建时间。
        type: string
      id:
        description: ID 是电话明细 ID。
        example: 1
        type: integer
      label:
        description: Label 是号码标签。
        example: 手机
        type: string
      phone:
        description: Phone 是电话号码。
        example: "13800000000"
        type: string
      primary:
        description: Primary 表示是否主联系电话。
        example: true
        type: boolean
      updated_at:
        description: UpdatedAt 是更新时间。
