          description: Created
          schema:
            $ref: '#/definitions/contact.ContactResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建联系人
      tags:
      - 联系人
