      created_at:
        description: CreatedAt 是创建时间。
        type: string
      id:
        description: ID 是客户 ID。
        example: 1
        type: integer
      name:
        description: Name 是客户名称。
        example: 测试客户
        type: string
      phone:
        description: Phone 是旧版客户电话字段；新接口不再写入，电话请维护到联系人电话明细。
        example: ""
        type: string
      updated_at:
        description: UpdatedAt 是更新时间。
        type: string
    type: object
  customer.ErrorResponse:
    properties:
      code:
