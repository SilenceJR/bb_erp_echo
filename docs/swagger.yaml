info:
  contact: {}
  description: 博邦 ERP Echo + GORM 模块化单体后台接口文档。后续新增、修改、删除接口时，必须同步更新 Swagger 注释、docs/API.md
    和 test.http。
  title: 博邦 ERP 管理系统 API
  version: 0.1.0
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: '使用账号密码登录并签发 JWT；后续接口通过 Authorization: Bearer <token> 认证。'
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: 账号登录
      tags:
      - 登录认证
  /api/v1/auth/me:
    get:
      description: 返回当前登录账号的账号类型、组织、部门、终端、角色和权限列表。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.CurrentUserDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 当前用户
      tags:
      - 登录认证
  /api/v1/contacts:
    get:
      description: 返回联系人列表，并预加载联系人电话明细。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/contact.ContactResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询联系人列表
      tags:
      - 联系人
    post:
      consumes:
      - application/json
      description: 创建联系人时必须携带 customer_id，由联系人接口建立客户与联系人的关联关系。
      parameters:
      - description: 创建联系人参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/contact.CreateContactRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/contact.ContactResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建联系人
      tags:
      - 联系人
  /api/v1/contacts/{id}:
    delete:
      description: 软删除联系人，并同步软删除其电话明细。
      parameters:
      - description: 联系人 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除联系人
      tags:
      - 联系人
    get:
      description: 通过联系人 ID 查询联系人详情，并预加载电话明细。
      parameters:
      - description: 联系人 ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
