basePath: /
definitions:
  app.HealthResponse:
    properties:
      status:
        description: Status 是服务存活状态。
        example: ok
        type: string
      time:
        description: Time 是服务端当前时间。
        type: string
    type: object
  app.ReadyResponse:
    properties:
      message:
        description: Message 是不可用时的说明。
        example: database ping failed
        type: string
      status:
        description: Status 是服务就绪状态。
        example: ready
        type: string
    type: object
  auth.ChangePasswordRequest:
    properties:
      current_password:
        description: CurrentPassword 是当前密码。
        example: admin123456
        type: string
      new_password:
        description: NewPassword 是待设置的新密码，至少 8 个字符且不超过 bcrypt 支持的长度。
        example: newAdmin123456
        type: string
    required:
    - current_password
    - new_password
    type: object
  auth.CurrentUserDTO:
    properties:
      account_type:
        description: AccountType 是账号类型。
        example: personal
        type: string
      department_id:
        description: DepartmentID 是所属部门 ID。
        type: integer
      id:
        description: ID 是用户 ID。
        example: 1
        type: integer
      name:
        description: Name 是账号显示名称。
        example: 系统管理员
        type: string
      organization_id:
        description: OrganizationID 是所属组织 ID。
        example: 1
        type: integer
      permissions:
        description: Permissions 是当前账号拥有的权限编码列表。
        items:
          type: string
        type: array
      roles:
        description: Roles 是当前账号拥有的角色编码列表。
        items:
          type: string
        type: array
      terminal_id:
        description: TerminalID 是所属终端 ID。
        type: integer
      username:
        description: Username 是登录账号。
        example: admin
        type: string
    type: object
  auth.ErrorResponse:
    properties:
      code:
        description: Code 是错误码。
        type: string
      message:
        description: Message 是前端可展示错误信息。
        type: string
      request_id:
        description: RequestID 是请求 ID，用于关联日志。
        type: string
    type: object
  auth.LoginRequest:
    properties:
      password:
        description: Password 是登录密码。
        example: admin123456
        type: string
      username:
        description: Username 是登录账号。
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        description: AccessToken 是 JWT 访问令牌。
        type: string
      expires_at:
        description: ExpiresAt 是令牌过期时间。
        type: string
      refresh_expires_at:
        description: RefreshExpiresAt 是本次 refresh token 的滚动失效时间。
        type: string
      refresh_token:
        description: RefreshToken 是用于静默续期的轮换令牌。
        type: string
      user:
        allOf:
        - $ref: '#/definitions/auth.CurrentUserDTO'
        description: User 是当前登录身份快照。
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        description: RefreshToken 是登录或上次续期返回的 refresh token。
        type: string
    required:
    - refresh_token
    type: object
  customer.CodePage:
