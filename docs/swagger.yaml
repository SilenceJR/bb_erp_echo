info:
  contact: {}
  description: 博邦 ERP Echo + GORM 模块化单体后台接口文档。后续新增、修改、删除接口时，必须同步更新 Swagger 注释、docs/API.md
    和 test.http。
  title: 博邦 ERP 管理系统 API
  version: 0.1.0
paths:
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: 校验当前密码后修改当前登录账号的密码；成功后原 JWT 立即失效，需要重新登录。
      parameters:
      - description: 密码修改参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 修改当前用户密码
      tags:
      - 登录认证
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: '使用账号密码登录并签发 JWT；后续接口通过 Authorization: Bearer <token> 认证。'
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: 账号登录
      tags:
      - 登录认证
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: 撤销当前 refresh token，客户端应同时清理本地 access token。
      parameters:
      - description: 退出参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: 退出登录
      tags:
      - 登录认证
  /api/v1/auth/me:
    get:
      description: 返回当前登录账号的账号类型、组织、部门、终端、角色和权限列表。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.CurrentUserDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 当前用户
      tags:
      - 登录认证
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 轮换 refresh token 并签发新的 JWT；旧 refresh token 成功使用后立即失效。
      parameters:
      - description: 刷新参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: 刷新登录会话
      tags:
      - 登录认证
  /api/v1/customer-codes:
    get:
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页条数
        in: query
        name: page_size
        type: integer
      - description: 编码或资料关键词
        in: query
        name: q
        type: string
      - description: all、multiple 或 empty
        in: query
        name: filter
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/customer.CodePage'
      security:
      - BearerAuth: []
      summary: 客户编码分组列表
      tags:
      - 客户
    post:
      consumes:
      - application/json
      parameters:
      - description: 编码留空时自动生成
        in: body
        name: body
        schema:
          $ref: '#/definitions/customer.CodeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/customer.CodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/customer.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/customer.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建客户编码
      tags:
      - 客户
  /api/v1/customer-codes/{id}:
    delete:
      parameters:
      - description: 客户编码 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/customer.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/customer.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除空客户编码
      tags:
      - 客户
    patch:
      consumes:
      - application/json
      parameters:
      - description: 客户编码 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 客户编码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/customer.CodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/customer.CodeResponse'
        "404":
