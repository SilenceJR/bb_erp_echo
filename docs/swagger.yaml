basePath: /
definitions:
  app.HealthResponse:
    properties:
      status:
        description: Status 是服务存活状态。
        example: ok
        type: string
      time:
        description: Time 是服务端当前时间。
        type: string
    type: object
  app.ReadyResponse:
    properties:
      message:
        description: Message 是不可用时的说明。
        example: database ping failed
        type: string
      status:
        description: Status 是服务就绪状态。
        example: ready
        type: string
    type: object
  auth.CurrentUserDTO:
    properties:
      account_type:
        description: AccountType 是账号类型。
        example: personal
        type: string
      department_id:
        description: DepartmentID 是所属部门 ID。
        type: integer
      id:
        description: ID 是用户 ID。
        example: 1
        type: integer
      name:
        description: Name 是账号显示名称。
        example: 系统管理员
        type: string
      organization_id:
        description: OrganizationID 是所属组织 ID。
        example: 1
        type: integer
      permissions:
        description: Permissions 是当前账号拥有的权限编码列表。
        items:
          type: string
        type: array
      roles:
        description: Roles 是当前账号拥有的角色编码列表。
        items:
          type: string
        type: array
      terminal_id:
        description: TerminalID 是所属终端 ID。
        type: integer
      username:
        description: Username 是登录账号。
        example: admin
        type: string
    type: object
  auth.ErrorResponse:
    properties:
      code:
        description: Code 是错误码。
        type: string
      message:
        description: Message 是前端可展示错误信息。
        type: string
      request_id:
        description: RequestID 是请求 ID，用于关联日志。
        type: string
    type: object
  auth.LoginRequest:
    properties:
      password:
        description: Password 是登录密码。
        example: admin123456
        type: string
      username:
        description: Username 是登录账号。
        example: admin
        type: string
    required:
    - password
    - username
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        description: AccessToken 是 JWT 访问令牌。
        type: string
      expires_at:
        description: ExpiresAt 是令牌过期时间。
        type: string
      user:
        allOf:
        - $ref: '#/definitions/auth.CurrentUserDTO'
        description: User 是当前登录身份快照。
    type: object
  contact.ContactPhoneRequest:
    properties:
      label:
        description: Label 是号码标签，例如手机、座机、微信同号。
        example: 手机
        type: string
      phone:
        description: Phone 是电话号码。
        example: "13800000000"
        type: string
      primary:
        description: Primary 表示是否为主联系电话。
        example: true
        type: boolean
    required:
    - phone
    type: object
  contact.ContactPhoneResponse:
    properties:
      contact_id:
        description: ContactID 是所属联系人 ID。
        example: 1
        type: integer
      created_at:
        description: CreatedAt 是创建时间。
        type: string
      id:
        description: ID 是电话明细 ID。
        example: 1
        type: integer
      label:
        description: Label 是号码标签。
        example: 手机
        type: string
      phone:
        description: Phone 是电话号码。
        example: "13800000000"
        type: string
      primary:
        description: Primary 表示是否主联系电话。
        example: true
        type: boolean
      updated_at:
        description: UpdatedAt 是更新时间。
        type: string
    type: object
  contact.ContactResponse:
    properties:
      created_at:
        description: CreatedAt 是创建时间。
        type: string
      customer_id:
        description: CustomerID 是所属客户 ID。
        example: 1
        type: integer
      id:
        description: ID 是联系人 ID。
        example: 1
        type: integer
      name:
        description: Name 是联系人姓名。
        example: 张三
        type: string
      phones:
        description: Phones 是联系人电话明细。
        items:
          $ref: '#/definitions/contact.ContactPhoneResponse'
        type: array
      updated_at:
        description: UpdatedAt 是更新时间。
        type: string
    type: object
  contact.CreateContactRequest:
    properties:
      customer_id:
        description: CustomerID 是联系人所属客户 ID。
        example: 1
        type: integer
      name:
        description: Name 是联系人姓名。
        example: 张三
        type: string
      phones:
        description: Phones 是联系人电话明细。
        items:
          $ref: '#/definitions/contact.ContactPhoneRequest'
        type: array
    required:
    - customer_id
    - name
    type: object
  contact.ErrorResponse:
    properties:
      code:
        description: Code 是错误码。
        type: string
      message:
        description: Message 是前端可展示错误信息。
        type: string
      request_id:
        description: RequestID 是请求 ID，用于关联日志。
        type: string
    type: object
  contact.UpdateContactRequest:
    properties:
      customer_id:
        description: CustomerID 是联系人所属客户 ID。
        example: 1
        type: integer
      name:
        description: Name 是联系人姓名。
        example: 张三-更新
        type: string
      phones:
        description: Phones 是联系人电话明细；更新时整体替换旧电话。
        items:
          $ref: '#/definitions/contact.ContactPhoneRequest'
        type: array
    required:
    - customer_id
    - name
    type: object
  customer.CreateCustomerRequest:
    properties:
      code:
        description: Code 是客户编码，用于内部检索和去重。
        example: CUST-001
        type: string
      name:
        description: Name 是客户名称。
        example: 测试客户
        type: string
      phone:
        description: Phone 是客户座机或主要联系电话。
        example: 0755-88888888
        type: string
    required:
    - code
    - name
    type: object
  customer.CustomerContactResponse:
    properties:
      created_at:
        description: CreatedAt 是创建时间。
        type: string
      customer_id:
        description: CustomerID 是所属客户 ID。
        example: 1
        type: integer
      id:
        description: ID 是联系人 ID。
        example: 1
        type: integer
      name:
        description: Name 是联系人姓名。
        example: 张三
        type: string
      phones:
        description: Phones 是联系人电话明细。
        items:
          $ref: '#/definitions/customer.CustomerPhoneResponse'
        type: array
      updated_at:
        description: UpdatedAt 是更新时间。
        type: string
    type: object
  customer.CustomerPhoneResponse:
    properties:
      contact_id:
        description: ContactID 是所属联系人 ID。
        example: 1
        type: integer
      created_at:
        description: CreatedAt 是创建时间。
        type: string
      id:
        description: ID 是电话明细 ID。
        example: 1
        type: integer
      label:
        description: Label 是号码标签。
        example: 手机
        type: string
      phone:
        description: Phone 是电话号码。
        example: "13800000000"
        type: string
      primary:
        description: Primary 表示是否主联系电话。
        example: true
        type: boolean
      updated_at:
        description: UpdatedAt 是更新时间。
        type: string
    type: object
  customer.CustomerResponse:
    properties:
      address:
        description: Address 是客户地址。
        example: 深圳市宝安区
        type: string
      code:
        description: Code 是客户编码。
        example: CUST-001
        type: string
      contacts:
        description: Contacts 是客户联系人列表。
        items:
          $ref: '#/definitions/customer.CustomerContactResponse'
        type: array
      created_at:
        description: CreatedAt 是创建时间。
        type: string
      id:
        description: ID 是客户 ID。
        example: 1
        type: integer
      name:
        description: Name 是客户名称。
        example: 测试客户
        type: string
      phone:
        description: Phone 是旧版客户电话字段；新接口不再写入，电话请维护到联系人电话明细。
        example: ""
        type: string
      updated_at:
        description: UpdatedAt 是更新时间。
        type: string
    type: object
  customer.ErrorResponse:
    properties:
      code:
        description: Code 是错误码。
        type: string
      message:
        description: Message 是前端可展示错误信息。
        type: string
      request_id:
        description: RequestID 是请求 ID，用于关联日志。
        type: string
    type: object
  customer.UpdateCustomerRequest:
    properties:
      address:
        description: Address 是客户地址。
        example: 深圳市宝安区
        type: string
      code:
        description: Code 是客户编码，用于内部检索和去重。
        example: CUST-001
        type: string
      name:
        description: Name 是客户名称。
        example: 测试客户-更新
        type: string
      phone:
        description: Phone 是客户座机或主要联系电话。
        example: 0755-66666666
        type: string
    required:
