info:
  contact: {}
  description: 博邦 ERP Echo + GORM 模块化单体后台接口文档。后续新增、修改、删除接口时，必须同步更新 Swagger 注释、docs/API.md
    和 test.http。
  title: 博邦 ERP 管理系统 API
  version: 0.1.0
paths:
  /api/v1/auth/change-password:
    post:
      consumes:
      - application/json
      description: 校验当前密码后修改当前登录账号的密码；成功后原 JWT 立即失效，需要重新登录。
      parameters:
      - description: 密码修改参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 修改当前用户密码
      tags:
      - 登录认证
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: '使用账号密码登录并签发 JWT；后续接口通过 Authorization: Bearer <token> 认证。'
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: 账号登录
      tags:
      - 登录认证
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: 撤销当前 refresh token，客户端应同时清理本地 access token。
      parameters:
      - description: 退出参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: 退出登录
      tags:
      - 登录认证
  /api/v1/auth/me:
    get:
      description: 返回当前登录账号的账号类型、组织、部门、终端、角色和权限列表。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.CurrentUserDTO'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 当前用户
      tags:
      - 登录认证
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 轮换 refresh token 并签发新的 JWT；旧 refresh token 成功使用后立即失效。
      parameters:
      - description: 刷新参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/auth.ErrorResponse'
      summary: 刷新登录会话
      tags:
      - 登录认证
  /api/v1/contacts:
    get:
      description: 返回联系人列表，并预加载联系人电话明细。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/contact.ContactResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/contact.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询联系人列表
      tags:
      - 联系人
