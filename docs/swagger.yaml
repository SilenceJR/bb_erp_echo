          description: Not Found
          schema:
            $ref: '#/definitions/workorder.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/workorder.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 临时建立仓库产品档案
      tags:
      - workorder
  /health:
    get:
      description: 返回进程存活状态，不依赖数据库。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.HealthResponse'
      summary: 健康检查
      tags:
      - 公共接口
  /ready:
    get:
      description: 检查数据库连接是否可用，用于服务启动和部署探活。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.ReadyResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/app.ReadyResponse'
      summary: 就绪检查
      tags:
      - 公共接口
securityDefinitions:
  BearerAuth:
    description: JWT 登录凭证，格式为：Bearer <token>。
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
