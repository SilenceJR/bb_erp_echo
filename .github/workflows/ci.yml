name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      update_base_url:
        description: "可选：仅手动临时包使用的下载基地址；手动构建不会发布 Release"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Validate Go 1.27
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release SemVer ordering
        run: |
          bash scripts/test-release-semver.sh
          bash scripts/test-release-delta-base.sh

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

  web:
    name: Build Web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js for web
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web management app
        working-directory: web
        run: npm run build

  client:
    name: Build Tauri frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js for Tauri client
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            client/package-lock.json

      - name: Install shared web dependencies
        working-directory: web
        run: npm ci

      - name: Install Tauri client dependencies
        working-directory: client
        run: npm ci

      - name: Build Tauri frontend
        working-directory: client
        run: npm run build

  rust:
    name: Validate Tauri Rust core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Check Rust formatting
        run: cargo fmt --all --manifest-path client/src-tauri/Cargo.toml -- --check

      - name: Check Rust core
        run: cargo check --locked --manifest-path client/src-tauri/Cargo.toml

      - name: Test Rust core
        run: cargo test --locked --manifest-path client/src-tauri/Cargo.toml

  build-windows:
    name: Build Windows release packages
    runs-on: windows-latest
    needs: [go, web, client, rust]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    environment: gitee-release

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve and validate build version
        id: release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
            $semverPattern = '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-((0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9]\d*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
            if ($tag -notmatch $semverPattern) {
              throw "Invalid release tag '$tag'. Expected vMAJOR.MINOR.PATCH[-prerelease]."
            }
            $version = $tag.Substring(1)
            $stable = -not $tag.Contains('-')
            "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            $version = "0.0.0-dev.${{ github.run_number }}"
            $stable = $false
            "tag=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          "stable=$($stable.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate Gitee release configuration
        if: steps.release.outputs.stable == 'true'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          if (-not "${{ vars.GITEE_RELEASE_OWNER }}" -or -not "${{ vars.GITEE_RELEASE_REPO }}") {
            throw "GITEE_RELEASE_OWNER and GITEE_RELEASE_REPO repository variables are required for tag builds."
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -or -not $env:TAURI_UPDATER_PUBLIC_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD and TAURI_UPDATER_PUBLIC_KEY must be configured for official releases."
          }
          & "$env:GITHUB_WORKSPACE/scripts/normalize-tauri-public-key.ps1" -Value $env:TAURI_UPDATER_PUBLIC_KEY | Out-Null

      - name: Normalize Tauri updater public key
        if: steps.release.outputs.stable == 'true'
        id: updater-key
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $normalized = (& "$env:GITHUB_WORKSPACE/scripts/normalize-tauri-public-key.ps1" -Value $env:TAURI_UPDATER_PUBLIC_KEY) -join ""
          "value=$normalized" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js for web
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web management app
        working-directory: web
        run: npm run build

      - name: Set up Node.js for Tauri client
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Tauri client dependencies
        working-directory: client
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Windows C compiler for SQLite
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target

      - name: Test Windows Rust core
        run: cargo test --locked --manifest-path client/src-tauri/Cargo.toml

      - name: Build Windows Go server
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: |
          New-Item -ItemType Directory -Force -Path release-build
          go build -trimpath -ldflags "-s -w -X bb_erp_echo/internal/buildinfo.Version=${{ steps.release.outputs.version }}" -o release-build/bb-erp-server.exe ./cmd/server

      - name: Build Windows updater
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o release-build/bb-erp-updater.exe ./cmd/updater

      - name: Build Windows Tauri client
        working-directory: client
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          BB_ERP_UPDATE_PUBLIC_KEY: ${{ steps.updater-key.outputs.value }}
        run: |
          $createUpdaterArtifacts = "${{ steps.release.outputs.stable }}" -eq "true"
          if ($createUpdaterArtifacts) {
            $env:BB_ERP_UPDATE_PUBLIC_KEY = (& "$env:GITHUB_WORKSPACE/scripts/normalize-tauri-public-key.ps1" -Value $env:BB_ERP_UPDATE_PUBLIC_KEY) -join ""
          }
          if (-not $createUpdaterArtifacts) {
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY -ErrorAction SilentlyContinue
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD -ErrorAction SilentlyContinue
            Remove-Item Env:BB_ERP_UPDATE_PUBLIC_KEY -ErrorAction SilentlyContinue
          }
          @{ version = "${{ steps.release.outputs.version }}"; bundle = @{ createUpdaterArtifacts = $createUpdaterArtifacts } } | ConvertTo-Json -Compress |
            Set-Content -Path "../release-build/tauri-version.json" -Encoding UTF8
          npm run desktop:build -- --bundles nsis --config ../release-build/tauri-version.json

      - name: Assemble Windows release packages
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ steps.updater-key.outputs.value }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = "${{ steps.release.outputs.version }}"
          $tag = "${{ steps.release.outputs.tag }}"
          $baseUrl = "${{ inputs.update_base_url }}"
          if (-not $baseUrl -and $tag) {
            $baseUrl = "https://gitee.com/${{ vars.GITEE_RELEASE_OWNER }}/${{ vars.GITEE_RELEASE_REPO }}/releases/download/$tag"
          }
          $baseUrl = $baseUrl.TrimEnd("/")
          $stableManifestUrl = ""
          if ("${{ vars.GITEE_RELEASE_OWNER }}" -and "${{ vars.GITEE_RELEASE_REPO }}") {
            $stableManifestUrl = "https://gitee.com/${{ vars.GITEE_RELEASE_OWNER }}/${{ vars.GITEE_RELEASE_REPO }}/raw/main/update-manifest.json"
          }
          $updateEnabled = if ($stableManifestUrl) { "true" } else { "false" }
          $updateSigningPublicKey = (& "$env:GITHUB_WORKSPACE/scripts/normalize-tauri-public-key.ps1" -Value $env:TAURI_UPDATER_PUBLIC_KEY) -join ""

          $serverPackageRoot = "release-build/packages/server"
          $clientPackageRoot = "release-build/packages/client"
          $allInOneRoot = "release-build/packages/all-in-one"
          $updaterPackageRoot = "release-build/packages/updater"

          New-Item -ItemType Directory -Force -Path $serverPackageRoot, $clientPackageRoot, $allInOneRoot, $updaterPackageRoot | Out-Null

          New-Item -ItemType Directory -Force -Path (Join-Path $serverPackageRoot "web") | Out-Null
          Copy-Item "release-build/bb-erp-server.exe" (Join-Path $serverPackageRoot "bb-erp-server.exe") -Force
          Copy-Item "release-build/bb-erp-updater.exe" (Join-Path $serverPackageRoot "bb-erp-updater.exe") -Force
          Copy-Item "web/dist" (Join-Path $serverPackageRoot "web/dist") -Recurse -Force
          if ($updateSigningPublicKey) {
            Set-Content -Path (Join-Path $serverPackageRoot "update-public.key") -Value $updateSigningPublicKey -NoNewline -Encoding UTF8
          }

          $clientExePath = "client/src-tauri/target/release/bb_erp_client.exe"
          if (-not (Test-Path -LiteralPath $clientExePath -PathType Leaf)) {
            throw "Tauri client executable was not found at the expected path: $clientExePath"
          }
          $portableClientFile = "release-build/bb-erp-client-windows-x86_64.exe"
          Copy-Item -LiteralPath $clientExePath $portableClientFile -Force
          $nsisInstaller = Get-ChildItem "client/src-tauri/target/release/bundle/nsis" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $nsisInstaller) {
            throw "Tauri NSIS installer was not found under client/src-tauri/target/release/bundle/nsis."
          }
          $nsisClientFile = "release-build/bb-erp-client-windows-x86_64-setup.exe"
          Copy-Item $nsisInstaller.FullName $nsisClientFile -Force
          New-Item -ItemType Directory -Force -Path (Join-Path $clientPackageRoot "client"), (Join-Path $clientPackageRoot "installer") | Out-Null
          Copy-Item -LiteralPath $clientExePath (Join-Path $clientPackageRoot "client/bb_erp_client.exe") -Force
          @"
          {
            "layout_version": 1,
            "version": "$version",
            "install_mode": "portable"
          }
          "@ | Set-Content -Path (Join-Path $clientPackageRoot "client/bb-erp-portable.json") -Encoding UTF8
          $portableTestRoot = "release-build/bb-erp-client-windows-x86_64-portable"
          New-Item -ItemType Directory -Force -Path $portableTestRoot | Out-Null
          Copy-Item -LiteralPath $clientExePath (Join-Path $portableTestRoot "bb-erp-client-windows-x86_64.exe") -Force
          Copy-Item -LiteralPath (Join-Path $clientPackageRoot "client/bb-erp-portable.json") (Join-Path $portableTestRoot "bb-erp-portable.json") -Force
          @"
          博邦 ERP Windows 便携客户端测试包
          ==================================

          请将本目录中的 EXE 与 bb-erp-portable.json 保持在同一目录后运行 EXE。
          RC 或手动构建版本仅用于独立测试，不会参与正式版自动更新。
          "@ | Set-Content -Path (Join-Path $portableTestRoot "README.txt") -Encoding UTF8
          $installers = Get-ChildItem "client/src-tauri/target/release/bundle" -Include "*.exe","*.msi" -Recurse -ErrorAction SilentlyContinue
          foreach ($installer in $installers) {
            Copy-Item $installer.FullName (Join-Path $clientPackageRoot ("installer/" + $installer.Name)) -Force
          }

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist "bb-erp-server.exe" (
            echo [Error] bb-erp-server.exe not found.
            echo Please make sure this bat file stays in the same folder as bb-erp-server.exe.
            pause
            exit /b 1
          )
          set BB_ERP_HTTP_HOST=0.0.0.0
          set BB_ERP_HTTP_PORT=8080
          set BB_ERP_APP_ENVIRONMENT=production
          set BB_ERP_DATABASE_PATH=data\erp.db
          set BB_ERP_LOG_DIR=logs
          set BB_ERP_FILES_ROOT_DIR=static\uploads
          set BB_ERP_WEB_ENABLED=true
          set BB_ERP_WEB_DIST_DIR=web\dist
          set BB_ERP_UPDATE_ENABLED=__UPDATE_ENABLED__
          set BB_ERP_UPDATE_CACHE_DIR=updates
          set BB_ERP_UPDATE_MANIFEST_URL=__UPDATE_MANIFEST_URL__
          set BB_ERP_UPDATE_SIGNING_PUBLIC_KEY_FILE=update-public.key
          set BB_ERP_ADMIN_USERNAME=admin
          bb-erp-server.exe
          echo.
          echo [Info] Server exited with code %errorlevel%.
          pause
          '@ | Set-Content -Path (Join-Path $serverPackageRoot "启动服务端.bat") -Encoding ASCII
          (Get-Content (Join-Path $serverPackageRoot "启动服务端.bat") -Raw).Replace("__UPDATE_MANIFEST_URL__", $stableManifestUrl).Replace("__UPDATE_ENABLED__", $updateEnabled) |
            Set-Content -Path (Join-Path $serverPackageRoot "启动服务端.bat") -Encoding ASCII

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist bb-erp-updater.exe (
            echo bb-erp-updater.exe was not found.
            pause
            exit /b 1
          )
          bb-erp-updater.exe -package "%~dp0bb-erp-server-windows.zip" -install-dir "%~dp0"
          pause
          '@ | Set-Content -Path (Join-Path $serverPackageRoot "一键升级服务端.bat") -Encoding ASCII

          @'
          博邦 ERP 服务端升级包
          =====================

          内容：
          - bb-erp-server.exe：Go Windows 服务端。
          - bb-erp-updater.exe：服务端升级器。
          - web/dist：服务端托管的 Web 管理端静态文件。

          首次部署：
          1. 解压到服务端电脑目录。
          2. 双击“启动服务端.bat”。

          升级：
          1. 不要覆盖 data、logs、updates、backups 目录。
          2. 可用 bb-erp-updater.exe 执行升级，升级器会备份旧服务端和 web 目录。
          '@ | Set-Content -Path (Join-Path $serverPackageRoot "README.txt") -Encoding UTF8

          @"
          {
            "version": "$version",
            "server_version": "$version",
            "client_version": "$version"
          }
          "@ | Set-Content -Path (Join-Path $serverPackageRoot "version.json") -Encoding UTF8

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          for %%F in ("installer\*.exe") do (
            start "BB ERP Client Installer" "%%~fF"
            exit /b 0
          )
          for %%F in ("client\*.exe") do (
            start "BB ERP Client" "%%~fF"
            exit /b 0
          )
          echo Client installer or exe was not found.
          pause
          exit /b 1
          '@ | Set-Content -Path (Join-Path $clientPackageRoot "一键升级客户端.bat") -Encoding ASCII

          @'
          博邦 ERP 客户端升级包
          =====================

          内容：
          - client：Tauri Windows 客户端便携 exe。
          - client/bb-erp-portable.json：便携安装标记，请与 client exe 一同保留，不要删除。
          - installer：Tauri Windows 安装器。

          员工电脑只需要下载本包。服务端电脑会通过 /api/v1/updates/client/download 分发这个包。
          '@ | Set-Content -Path (Join-Path $clientPackageRoot "README.txt") -Encoding UTF8

          @"
          {
            "version": "$version",
            "client_version": "$version"
          }
          "@ | Set-Content -Path (Join-Path $clientPackageRoot "version.json") -Encoding UTF8

          Copy-Item "release-build/bb-erp-updater.exe" (Join-Path $updaterPackageRoot "bb-erp-updater.exe") -Force
          @'
          bb-erp-updater.exe 用法：

          本地包升级：
          bb-erp-updater.exe -package bb-erp-server-windows.zip -install-dir C:\bb-erp

          远端 manifest 升级：
          bb-erp-updater.exe -manifest-url https://example.com/update-manifest.json -install-dir C:\bb-erp -current-version 0.1.0

          如果服务端注册为 Windows Service，可追加：
          -service bb-erp
          '@ | Set-Content -Path (Join-Path $updaterPackageRoot "README.txt") -Encoding UTF8

          New-Item -ItemType Directory -Force -Path (Join-Path $allInOneRoot "server"), (Join-Path $allInOneRoot "client"), (Join-Path $allInOneRoot "installer"), (Join-Path $allInOneRoot "server/data"), (Join-Path $allInOneRoot "server/logs"), (Join-Path $allInOneRoot "server/updates") | Out-Null
          Copy-Item "$serverPackageRoot/*" (Join-Path $allInOneRoot "server") -Recurse -Force
          Copy-Item "$clientPackageRoot/client/*" (Join-Path $allInOneRoot "client") -Recurse -Force
          Copy-Item "$clientPackageRoot/installer/*" (Join-Path $allInOneRoot "installer") -Recurse -Force
          if (-not (Test-Path -LiteralPath (Join-Path $allInOneRoot "client/bb_erp_client.exe") -PathType Leaf)) {
            throw "Portable client executable was not copied to the expected all-in-one path."
          }

          @'
          @echo off
          setlocal
          cd /d "%~dp0server"
          if not exist "bb-erp-server.exe" (
            echo [Error] bb-erp-server.exe not found under server directory.
            pause
            exit /b 1
          )
          set BB_ERP_HTTP_HOST=0.0.0.0
          set BB_ERP_HTTP_PORT=8080
          set BB_ERP_APP_ENVIRONMENT=production
          set BB_ERP_DATABASE_PATH=data\erp.db
          set BB_ERP_LOG_DIR=logs
          set BB_ERP_FILES_ROOT_DIR=static\uploads
          set BB_ERP_WEB_ENABLED=true
          set BB_ERP_WEB_DIST_DIR=web\dist
          set BB_ERP_UPDATE_ENABLED=__UPDATE_ENABLED__
          set BB_ERP_UPDATE_CACHE_DIR=updates
          set BB_ERP_UPDATE_MANIFEST_URL=__UPDATE_MANIFEST_URL__
          set BB_ERP_UPDATE_SIGNING_PUBLIC_KEY_FILE=update-public.key
          set BB_ERP_ADMIN_USERNAME=admin
          bb-erp-server.exe
          echo.
          echo [Info] Server exited with code %errorlevel%.
          pause
          '@ | Set-Content -Path (Join-Path $allInOneRoot "启动服务端.bat") -Encoding ASCII
          (Get-Content (Join-Path $allInOneRoot "启动服务端.bat") -Raw).Replace("__UPDATE_MANIFEST_URL__", $stableManifestUrl).Replace("__UPDATE_ENABLED__", $updateEnabled) |
            Set-Content -Path (Join-Path $allInOneRoot "启动服务端.bat") -Encoding ASCII

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist "server\bb-erp-server.exe" (
            echo [Error] server\bb-erp-server.exe not found.
            pause
            exit /b 1
          )
          set BB_ERP_HTTP_HOST=0.0.0.0
          set BB_ERP_HTTP_PORT=8080
          set BB_ERP_APP_ENVIRONMENT=production
          set BB_ERP_DATABASE_PATH=data\erp.db
          set BB_ERP_LOG_DIR=logs
          set BB_ERP_FILES_ROOT_DIR=static\uploads
          set BB_ERP_WEB_ENABLED=true
          set BB_ERP_WEB_DIST_DIR=web\dist
          set BB_ERP_UPDATE_ENABLED=__UPDATE_ENABLED__
          set BB_ERP_UPDATE_CACHE_DIR=updates
          set BB_ERP_UPDATE_MANIFEST_URL=__UPDATE_MANIFEST_URL__
          set BB_ERP_UPDATE_SIGNING_PUBLIC_KEY_FILE=server\update-public.key
          set BB_ERP_ADMIN_USERNAME=admin
          start "BB ERP Server" /min /d "%~dp0server" cmd /c "bb-erp-server.exe & echo. & echo [Info] Server exited. & pause"
          timeout /t 3 /nobreak >nul
          if not exist "client\*.exe" (
            echo [Error] Client exe not found under client directory.
            pause
            exit /b 1
          )
          for %%F in ("client\*.exe") do (
            start "BB ERP Client" "%%~fF"
            exit /b 0
          )
          echo [Error] Client exe not found under client directory.
          pause
          exit /b 1
          '@ | Set-Content -Path (Join-Path $allInOneRoot "启动系统.bat") -Encoding ASCII
          (Get-Content (Join-Path $allInOneRoot "启动系统.bat") -Raw).Replace("__UPDATE_MANIFEST_URL__", $stableManifestUrl).Replace("__UPDATE_ENABLED__", $updateEnabled) |
            Set-Content -Path (Join-Path $allInOneRoot "启动系统.bat") -Encoding ASCII

          @'
          博邦 ERP Windows 全量便携包
          ===========================

          使用方式：
          1. 解压整个目录，不要只复制其中某一个 exe。
          2. 双击“启动系统.bat”，脚本会先启动 Go 服务端，再打开 Tauri 客户端。
          3. 默认服务地址：http://127.0.0.1:8080
          4. 默认账号：admin
          5. 默认密码：admin123456

          目录说明：
          - server/bb-erp-server.exe：Go 后端服务。
          - server/web/dist：后端托管的 Web 管理端静态文件，不要删除。
          - server/data：SQLite 数据目录。首次启动会自动创建 erp.db。
          - server/logs：运行日志目录。
          - client：Tauri Windows 客户端。
          - installer：Tauri 生成的安装器，便携使用时不是必须。

          注意：
          - 如果 Windows 防火墙提示，请允许本机访问 8080 端口。
          - 首次启动使用默认管理员登录后，请进入“系统 / 用户”修改管理员密码。
          - 后续备份数据时，优先备份 server/data 目录。
          '@ | Set-Content -Path (Join-Path $allInOneRoot "README.txt") -Encoding UTF8

          Compress-Archive -Path "$serverPackageRoot/*" -DestinationPath "release-build/bb-erp-server-windows.zip" -Force
          Compress-Archive -Path "$clientPackageRoot/*" -DestinationPath "release-build/bb-erp-client-windows.zip" -Force
          Compress-Archive -Path "$allInOneRoot/*" -DestinationPath "release-build/bb-erp-all-in-one-windows.zip" -Force
          Compress-Archive -Path "$updaterPackageRoot/*" -DestinationPath "release-build/bb-erp-updater-windows.zip" -Force

          $serverHash = (Get-FileHash "release-build/bb-erp-server-windows.zip" -Algorithm SHA256).Hash.ToLower()
          $clientHash = (Get-FileHash "release-build/bb-erp-client-windows.zip" -Algorithm SHA256).Hash.ToLower()
          $allInOneHash = (Get-FileHash "release-build/bb-erp-all-in-one-windows.zip" -Algorithm SHA256).Hash.ToLower()
          $updaterHash = (Get-FileHash "release-build/bb-erp-updater-windows.zip" -Algorithm SHA256).Hash.ToLower()

          $serverUrl = ""
          $clientUrl = ""
          $allInOneUrl = ""
          $updaterUrl = ""
          if ($baseUrl) {
            $serverUrl = "$baseUrl/bb-erp-server-windows.zip"
            $clientUrl = "$baseUrl/bb-erp-client-windows.zip"
            $allInOneUrl = "$baseUrl/bb-erp-all-in-one-windows.zip"
            $updaterUrl = "$baseUrl/bb-erp-updater-windows.zip"
          }

          $manifest = [ordered]@{
            version = $version
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            notes = "BB ERP Windows release packages"
            server = [ordered]@{
              version = $version
              url = $serverUrl
              sha256 = $serverHash
              size = (Get-Item "release-build/bb-erp-server-windows.zip").Length
            }
            client = [ordered]@{
              version = $version
              url = $clientUrl
              sha256 = $clientHash
              size = (Get-Item "release-build/bb-erp-client-windows.zip").Length
            }
            all_in_one = [ordered]@{
              version = $version
              url = $allInOneUrl
              sha256 = $allInOneHash
              size = (Get-Item "release-build/bb-erp-all-in-one-windows.zip").Length
            }
            updater = [ordered]@{
              version = $version
              url = $updaterUrl
              sha256 = $updaterHash
              size = (Get-Item "release-build/bb-erp-updater-windows.zip").Length
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path "release-build/update-manifest.json" -Encoding UTF8

      - name: Build signed client update manifest and optional delta
        if: steps.release.outputs.stable == 'true'
        shell: bash
        env:
          RELEASE_ASSET_DIR: release-build
          RELEASE_MANIFEST_FILE: release-build/update-manifest.json
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_BASE_URL: https://gitee.com/${{ vars.GITEE_RELEASE_OWNER }}/${{ vars.GITEE_RELEASE_REPO }}/releases/download/${{ steps.release.outputs.tag }}
          RELEASE_STABLE_MANIFEST_URL: https://gitee.com/${{ vars.GITEE_RELEASE_OWNER }}/${{ vars.GITEE_RELEASE_REPO }}/raw/main/update-manifest.json
          RELEASE_PORTABLE_FILE: release-build/bb-erp-client-windows-x86_64.exe
          RELEASE_NSIS_FILE: release-build/bb-erp-client-windows-x86_64-setup.exe
          TAURI_CLIENT_DIR: client
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBLIC_KEY: ${{ steps.updater-key.outputs.value }}
          RELEASE_ALLOW_HISTORICAL_STABLE_MIGRATION: ${{ steps.release.outputs.version == '0.0.2' && 'true' || 'false' }}
        run: bash scripts/build-client-update-v2.sh

      - name: Collect complete release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $publishRoot = "release-build/publish-assets"
          New-Item -ItemType Directory -Force -Path $publishRoot | Out-Null
          Copy-Item "release-build/bb-erp-server-windows.zip", "release-build/bb-erp-client-windows.zip", "release-build/bb-erp-all-in-one-windows.zip", "release-build/bb-erp-updater-windows.zip", "release-build/update-manifest.json" -Destination $publishRoot -Force
          if (Test-Path "release-build/bb-erp-client-windows-x86_64.exe") {
            Copy-Item "release-build/bb-erp-client-windows-x86_64.exe" -Destination $publishRoot -Force
          }
          if (Test-Path "release-build/bb-erp-client-windows-x86_64-setup.exe") {
            Copy-Item "release-build/bb-erp-client-windows-x86_64-setup.exe" -Destination $publishRoot -Force
          }
          Get-ChildItem "release-build" -Filter "*.zstpatch" -File -ErrorAction SilentlyContinue | Copy-Item -Destination $publishRoot -Force

      - name: Upload Windows server package
        uses: actions/upload-artifact@v7
        with:
          name: bb-erp-server-windows-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          archive: false
          path: release-build/bb-erp-server-windows.zip

      - name: Upload Windows client package
        uses: actions/upload-artifact@v7
        with:
          name: bb-erp-client-windows-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          archive: false
          path: release-build/bb-erp-client-windows.zip

      - name: Upload Windows all-in-one package
        uses: actions/upload-artifact@v7
        with:
          name: bb-erp-all-in-one-windows-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          archive: false
          path: release-build/bb-erp-all-in-one-windows.zip

      - name: Upload Windows updater
        uses: actions/upload-artifact@v7
        with:
          name: bb-erp-updater-windows-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          archive: false
          path: release-build/bb-erp-updater-windows.zip

      - name: Upload update manifest
        if: steps.release.outputs.stable == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: update-manifest-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          archive: false
          path: release-build/update-manifest.json

      - name: Upload Windows portable client test package
        uses: actions/upload-artifact@v7
        with:
          name: bb-erp-client-windows-portable-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          archive: false
          path: release-build/bb-erp-client-windows-x86_64-portable

      - name: Upload complete release bundle for publishing
        uses: actions/upload-artifact@v7
        with:
          name: gitee-release-assets-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: release-build/publish-assets

  publish-gitee:
    name: Publish verified Gitee release
    runs-on: ubuntu-latest
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    environment: gitee-release
    concurrency:
      group: gitee-production-release
      cancel-in-progress: false

    steps:
      - name: Checkout publisher
        uses: actions/checkout@v6

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: gitee-release-assets-${{ github.run_number }}
          path: release-assets

      - name: Publish to public Gitee distribution repository
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_SOURCE_TOKEN: ${{ secrets.GITEE_SOURCE_TOKEN }}
          GITEE_SOURCE_OWNER: ${{ vars.GITEE_SOURCE_OWNER }}
          GITEE_SOURCE_REPO: ${{ vars.GITEE_SOURCE_REPO }}
          GITEE_RELEASE_OWNER: ${{ vars.GITEE_RELEASE_OWNER }}
          GITEE_RELEASE_REPO: ${{ vars.GITEE_RELEASE_REPO }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ASSET_DIR: release-assets
          RELEASE_ALLOW_HISTORICAL_STABLE_MIGRATION: ${{ github.ref_name == 'v0.0.2' && 'true' || 'false' }}
        run: bash scripts/publish-gitee-release.sh
