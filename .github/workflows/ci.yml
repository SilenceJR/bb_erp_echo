name: CI and offline Windows artifacts

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional vMAJOR.MINOR.PATCH used for offline artifacts
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: Verify generated Swagger is current
        run: |
          go run github.com/swaggo/swag/cmd/swag@v1.16.2 init -g cmd/server/main.go -o docs
          git diff --exit-code -- docs/docs.go docs/swagger.json docs/swagger.yaml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            client/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
      - run: cargo fmt --all --manifest-path client/src-tauri/Cargo.toml -- --check
      - run: cargo check --locked --manifest-path client/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path client/src-tauri/Cargo.toml

  windows-rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
      - run: cargo check --locked --all-targets --manifest-path client/src-tauri/Cargo.toml
      - run: cargo test --locked --manifest-path client/src-tauri/Cargo.toml

  build-windows:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [go, web, rust, windows-rust]
    runs-on: windows-latest
    # Configure required reviewers and protected release refs on this
    # environment. Signing secrets are environment-scoped only.
    environment: release-signing
    steps:
      - uses: actions/checkout@v6
      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.release_tag }}' }
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Windows artifacts require vMAJOR.MINOR.PATCH.'
          }
          "value=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri -> target
      - name: Validate signing configuration
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_UPDATER_PUBLIC_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'Client update signing secrets are required.'
          }
      - name: Build and verify offline packages
        shell: pwsh
        env:
          CC: gcc
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/windows-package.ps1 -Version '${{ steps.version.outputs.value }}'
      - name: Validate packaged single-EXE contract
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'bb-erp-artifact-check'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $version = '${{ steps.version.outputs.value }}'
          $clientZip = "release-build/bb-erp-client-update-windows-v$version.zip"
          $allZip = "release-build/bb-erp-all-in-one-windows-v$version.zip"
          $serverZip = "release-build/bb-erp-server-windows-v$version.zip"
          Expand-Archive $clientZip (Join-Path $root 'client')
          Expand-Archive $allZip (Join-Path $root 'all')
          Expand-Archive $serverZip (Join-Path $root 'server')
          $clientFiles = Get-ChildItem (Join-Path $root 'client') -File | Select-Object -ExpandProperty Name
          if ((Compare-Object $clientFiles @('README.txt','bb_erp_client.exe','client-update.json'))) { throw 'Client update ZIP contains unexpected or missing files.' }
          @('server/bb-erp-server.exe','client/bb_erp_client.exe','client/client-update.json') | ForEach-Object {
            if (-not (Test-Path (Join-Path (Join-Path $root 'all') $_) -PathType Leaf)) { throw "All-in-one missing $_" }
          }
          if (-not (Test-Path (Join-Path $root 'server/bb-erp-server.exe') -PathType Leaf)) { throw 'Server ZIP missing full server executable.' }
          if (Get-ChildItem $root -Recurse -File | Where-Object { $_.Name -match '(?i)(updater|\.msi$|\.msix$|setup.*\.exe$)' }) { throw 'Legacy updater or installer found in ZIP.' }
          $manifest = Get-Content (Join-Path $root 'client/client-update.json') -Raw | ConvertFrom-Json
          $payloadPath = Join-Path $root 'client/payload.json'
          [IO.File]::WriteAllBytes($payloadPath, [Convert]::FromBase64String($manifest.payload))
          $payload = Get-Content $payloadPath -Raw | ConvertFrom-Json
          $clientVersion = (Get-Content 'client/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).version
          if ($payload.version -ne $clientVersion) { throw "Client update version $($payload.version) does not match source version $clientVersion." }
          $exe = Join-Path $root 'client/bb_erp_client.exe'
          if ((Get-Item $exe).Length -ne $payload.artifact.size) { throw 'Packaged EXE size mismatch.' }
          if ((Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $payload.artifact.sha256) { throw 'Packaged EXE hash mismatch.' }
          go run ./cmd/verify-update-signature -public-key $env:TAURI_UPDATER_PUBLIC_KEY -file $payloadPath -signature $manifest.signature
          go run ./cmd/verify-update-signature -public-key $env:TAURI_UPDATER_PUBLIC_KEY -file $exe -signature $payload.artifact.signature
      - uses: actions/upload-artifact@v7
        with:
          name: bb-erp-server-windows-${{ steps.version.outputs.value }}
          retention-days: 14
          if-no-files-found: error
          path: release-build/bb-erp-server-windows-v${{ steps.version.outputs.value }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: bb-erp-client-update-windows-${{ steps.version.outputs.value }}
          retention-days: 14
          if-no-files-found: error
          path: release-build/bb-erp-client-update-windows-v${{ steps.version.outputs.value }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: bb-erp-all-in-one-windows-${{ steps.version.outputs.value }}
          retention-days: 14
          if-no-files-found: error
          path: release-build/bb-erp-all-in-one-windows-v${{ steps.version.outputs.value }}.zip
