#:schema https://json.schemastore.org/any.json

env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/bb-erp-dev"
  cmd = "go build -trimpath -o ./tmp/bb-erp-dev ./cmd/server"
  delay = 500
  entrypoint = ["./tmp/bb-erp-dev"]
  exclude_dir = [".git", "assets", "tmp", "vendor", "testdata", "data", "logs", "updates", "backups", "static/uploads", "web/node_modules", "web/dist", "web/tmp", "client/node_modules", "client/dist", "client/src-tauri/target"]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  follow_symlink = false
  full_bin = ""
  ignore_dangerous_root_dir = false
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "500ms"
  log = "air-build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[build.windows]
  bin = "tmp\\bb-erp-dev.exe"
  cmd = "go build -trimpath -o ./tmp/bb-erp-dev.exe ./cmd/server"
  entrypoint = ["tmp\\bb-erp-dev.exe"]

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = true

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
