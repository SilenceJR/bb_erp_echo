[package]
name = "bb_erp_client"
default-run = "bb_erp_client"
version = "0.1.0"
description = "博邦 ERP 桌面端"
authors = ["Bobang ERP"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bb_erp_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22.1"
getrandom = "0.3.4"
minisign-verify = "0.2.5"
reqwest = { version = "0.12.28", features = ["rustls-tls", "json"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-updater = "2.10.1"
zstd = "0.13.3"
